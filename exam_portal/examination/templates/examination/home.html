<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Online Examination Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to right, #e3f2fd, #f8f9fa);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: #0d47a1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .navbar-brand {
            font-weight: bold;
            color: #fff;
        }

        .navbar-nav .nav-link {
            color: #fff !important;
            font-weight: 500;
            margin-left: 15px;
            transition: color 0.3s;
        }

        .navbar-nav .nav-link:hover {
            color: #ffeb3b !important;
        }

        .centered-container {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-box {
            background-color: rgba(33, 33, 33, 0.9);
            color: white;
            padding: 60px;
            border-radius: 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 1.5s ease-in-out;
            max-width: 700px;
        }

        .welcome-box h1 {
            font-size: 3rem;
            font-weight: 700;
        }

        .welcome-box p {
            font-size: 1.3rem;
            margin-top: 20px;
            color: #b0bec5;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .welcome-box {
                padding: 40px 20px;
            }
            .welcome-box h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Student Online Examination</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="{% url 'teacher_login' %}">Teacher</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'student_login' %}">Student</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Welcome Section -->
<div class="centered-container">
    <div class="welcome-box">
        <h1>Welcome to <br> Student Online Examination Portal</h1>
        <p>Your gateway to digital assessments</p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
