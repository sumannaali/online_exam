<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Portal - Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");
            background-size: cover;
            background-position: center;
            height: 100vh;
            color: white;
        }

        .auth-container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
        }

        .form-toggle {
            cursor: pointer;
            color: #0dcaf0;
            text-decoration: underline;
        }

        input, label, select {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container h-100 d-flex align-items-center justify-content-center">
        <div class="col-md-6 auth-container">

            <h2 class="text-center mb-4">Student Exam Portal</h2>

            <!-- Toggle Buttons -->
            <div class="text-center mb-3">
                <span class="form-toggle me-3" onclick="showForm('login')">Login</span>
                <span class="form-toggle me-3" onclick="showForm('register')">Register</span>
                <span class="form-toggle" onclick="showForm('otp')">Verify OTP</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="login-username">Username</label>
                    <input type="text" class="form-control" id="login-username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="login-password">Password</label>
                    <input type="password" class="form-control" id="login-password" name="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" method="POST" action="{% url 'register' %}" style="display: none;">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="reg-username">Username</label>
                    <input type="text" class="form-control" id="reg-username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="reg-email">Email</label>
                    <input type="email" class="form-control" id="reg-email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="reg-password">Password</label>
                    <input type="password" class="form-control" id="reg-password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="reg-role">Role</label>
                    <select class="form-select" name="role" id="reg-role" required>
                        <option value="">-- Select Role --</option>
                        <option value="student">Student</option>
                        <option value="invigilator">Invigilator</option>
                    </select>
                </div>
                <div class="d-grid mb-2">
                    <button type="submit" class="btn btn-success">Register & Send OTP</button>
                </div>
            </form>

            <!-- OTP Verification Form -->
            <form id="otp-form" method="POST" action="{% url 'verify_otp' %}" style="display: none;">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="otp">Enter OTP sent to your Email</label>
                    <input type="text" class="form-control" id="otp" name="otp" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning">Verify OTP</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        function showForm(formName) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('otp-form').style.display = 'none';

            if (formName === 'login') {
                document.getElementById('login-form').style.display = 'block';
            } else if (formName === 'register') {
                document.getElementById('register-form').style.display = 'block';
            } else if (formName === 'otp') {
                document.getElementById('otp-form').style.display = 'block';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login Page</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
</body>
</html>
